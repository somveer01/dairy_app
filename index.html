<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>diary_app</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <link rel="icon" href="/dairy_app/favicon.ico"/>
    <link rel="manifest" href="/dairy_app/manifest.json" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dairy App" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- PWA Install Banner -->
    <div id="install-banner" style="display:none; position:fixed; bottom:20px; left:16px; right:16px; background:#0284c7; color:#ffffff; padding:12px 16px; border-radius:14px; box-shadow:0 8px 24px rgba(2,132,199,0.4); z-index:999999; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; flex-direction:row; align-items:center; justify-content:space-between; animation:slideUp 0.4s ease;">
      <div style="display:flex; align-items:center; gap:10px; flex:1;">
        <span style="font-size:24px;">🥛</span>
        <div>
          <div style="font-weight:700; font-size:14px; color:#ffffff;">Install Dairy App</div>
          <div style="font-size:11px; color:#e0f2fe; margin-top:1px;">Add to your phone for 1-tap offline use</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button id="install-btn" style="background:#ffffff; color:#0284c7; border:none; padding:8px 14px; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;">📲 Install</button>
        <button id="close-banner-btn" style="background:transparent; border:none; color:#ffffff; font-size:16px; cursor:pointer; padding:4px 6px;">✕</button>
      </div>
    </div>

    <script>
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/dairy_app/sw.js').catch(err => console.log('SW reg error:', err));
        });
      }

      // PWA Install Prompt handling
      let deferredPrompt = null;
      const banner = document.getElementById('install-banner');
      const installBtn = document.getElementById('install-btn');
      const closeBtn = document.getElementById('close-banner-btn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (banner) {
          banner.style.display = 'flex';
        }
      });

      // Show banner after 2 seconds if user is on mobile browser
      setTimeout(() => {
        if (banner && banner.style.display !== 'flex') {
          banner.style.display = 'flex';
        }
      }, 2000);

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
              banner.style.display = 'none';
            }
            deferredPrompt = null;
          } else {
            alert('To install this app on your phone:\\n\\n1. Tap the 3 dots (⋮) in Chrome\\n2. Tap "Install app" or "Add to Home screen"\\n\\nThe app icon will be added to your phone screen!');
          }
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          if (banner) banner.style.display = 'none';
        });
      }
    </script>
  <script src="/dairy_app/_expo/static/js/web/index-64fa12b3cdeece5f6902d2df4f427a30.js" defer></script>
</body>
</html>
